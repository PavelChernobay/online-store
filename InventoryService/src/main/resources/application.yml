server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://inventory-db:5433/inventory_db
    username: user
    password: user
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

grpc:
  server:
    port: 9090