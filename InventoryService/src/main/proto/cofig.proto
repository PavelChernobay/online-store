syntax = "proto3";

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "org.onlinestore.orderservice.grpc";
option java_outer_classname = "ProductProto";

service InventoryService {

  rpc getProductByName (ProductGrpcRequest) returns (ProductGrpcResponse);

  rpc getListProductByName (ProductBatchGrpcRequest) returns (ProductBatchGrpcResponse);

  rpc updateProductQuantities (ProductQuantityBatch) returns (google.protobuf.Empty);

}

message ProductGrpcRequest {

  string name = 1;

}

message ProductGrpcResponse {

  string id = 1;
  string name = 2;
  int32 quantity = 3;
  double price = 4;
  int32 sale = 5;

}

message ProductBatchGrpcRequest {

  repeated string product_name= 1;

}

message ProductBatchGrpcResponse {

  repeated ProductGrpcResponse product_response = 1;

}

message ProductQuantityRequest {

  string product_name = 1;
  int32 quantity = 2;

}

message ProductQuantityBatch {

  repeated ProductQuantityRequest quantityProducts = 1;

}
