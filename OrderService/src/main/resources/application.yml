server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: user
    password: user
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    jwt:
      secret: "r9ZPBmZeMj3uO7Rzy5l4xinVfZerNZ97eUstX71ewWw="
      expiration-ms: 3600000
      refresh-expiration-ms: 604800000

grpc:
  client:
    inventory-service:
      address: "static://localhost:9090"
      negotiation-type: plaintext